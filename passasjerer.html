<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passasjerer · Fredagslotteriet</title>
<meta name="theme-color" content="#07111d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2307111d'/%3E%3Cpath d='M8 40 L52 39 Q58 40 60 44 L56 50 L10 50 Z' fill='%23f3ecdf'/%3E%3Cpath d='M20 39 L20 28 Q20 26 22 26 L42 26 Q46 26 49 30 L52 39 Z' fill='%23f3ecdf'/%3E%3Cpath d='M8 45 L59 44 L58 46 L8 47 Z' fill='%23ee4a2f'/%3E%3Ccircle cx='46' cy='15' r='5' fill='%235ef2b5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=JetBrains+Mono:wght@400;500;700&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap">
<link rel="stylesheet" href="css/base.css?v=12">
<link rel="stylesheet" href="css/pages.css?v=12">
</head>
<body data-page="passasjerer">
<div class="grain" aria-hidden="true"></div>
<header class="topbar" id="topbar"></header>

<main class="page">
  <div class="wrap wrap-narrow">
    <header class="page-head">
      <p class="eyebrow">Passasjerer</p>
      <h1 class="page-title">Faste <em>passasjerer</em></h1>
      <p class="page-lede">Alle står her fra uke til uke – med lodd-numrene de har valgt selv, ett per lodd.</p>
    </header>

    <form class="card add-card" id="regAdd" autocomplete="off" novalidate>
      <h2>Ny passasjer</h2>
      <div class="add-grid">
        <label class="field add-name"><span class="field-label">Navn</span><input class="field-input" name="name" type="text" maxlength="40" placeholder="F.eks. Kari Nordmann"></label>
        <div class="add-nums" id="regAddNums"></div>
        <button class="btn btn-primary add-btn" type="submit">Legg til</button>
      </div>
      <p class="add-note" id="regAddNote"></p>
    </form>

    <div class="reg-head"><h2>Alle passasjerer <span id="regCount"></span></h2><p>Endre nummer eller navn direkte i lista. Sett folk på pause hvis de ikke er med en stund.</p></div>
    <p class="reg-missing" id="regMissing" hidden></p>
    <ol class="reg-list" id="regList"></ol>
    <div class="empty" id="regEmpty" hidden><b>Ingen passasjerer ennå.</b>Legg til den første over.</div>
  </div>
</main>

<footer class="footer" id="footer"></footer>
<script src="js/util.js?v=12" defer></script>
<script src="js/store.js?v=12" defer></script>
<script src="js/shell.js?v=12" defer></script>
<script src="js/pages/passasjerer.js?v=12" defer></script>
</body>
</html>
