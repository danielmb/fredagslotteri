<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trekning · Fredagslotteriet</title>
<meta name="theme-color" content="#07111d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2307111d'/%3E%3Cpath d='M8 40 L52 39 Q58 40 60 44 L56 50 L10 50 Z' fill='%23f3ecdf'/%3E%3Cpath d='M20 39 L20 28 Q20 26 22 26 L42 26 Q46 26 49 30 L52 39 Z' fill='%23f3ecdf'/%3E%3Cpath d='M8 45 L59 44 L58 46 L8 47 Z' fill='%23ee4a2f'/%3E%3Ccircle cx='46' cy='15' r='5' fill='%235ef2b5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=JetBrains+Mono:wght@400;500;700&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap">
<link rel="stylesheet" href="css/base.css?v=14">
<link rel="stylesheet" href="css/stage.css?v=14">
</head>
<body data-page="trekning">
<div class="grain" aria-hidden="true"></div>
<header class="topbar" id="topbar"></header>

<main class="page page-stage">
  <div class="stage-head">
    <div class="game-tabs" role="tablist" aria-label="Velg spill">
      <button type="button" role="tab" class="game-tab is-active" data-game="hurtigbat" aria-selected="true"><span class="gt-ico">⛴</span><span><b>Hurtigbåten til Bodø</b><small>Hovedspillet · ca. 2 min</small></span></button>
      <button type="button" role="tab" class="game-tab" data-game="draugen" aria-selected="false"><span class="gt-ico">🦑</span><span><b>Draugen</b><small>Lofotfisket · ca. 2 min</small></span></button>
      <button type="button" role="tab" class="game-tab game-tab-new" data-game="keiser" aria-selected="false"><span class="gt-ico">🏔️</span><span><b>Keiservarden GP</b><small>Fysikk-kuleløp · ca. 1 min</small></span></button>
      <button type="button" role="tab" class="game-tab" data-game="lyn" aria-selected="false"><span class="gt-ico">⚡</span><span><b>Avgangstavla</b><small>Lyntrekning · 15 sek</small></span></button>
    </div>
  </div>
  <div class="stage-wrap">
    <div class="stage" id="stage" data-game="hurtigbat">
      <div class="scene" id="scene">
        <div class="sky" aria-hidden="true"><div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div></div>
        <svg class="scene-svg" id="sceneSvg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
        <canvas class="fx" id="fxCanvas" aria-hidden="true"></canvas>
        <svg class="draugen-svg" id="draugenSvg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
        <canvas class="keiser-canvas" id="keiserCanvas" aria-hidden="true"></canvas>
        <canvas class="fx keiser-fx" id="keiserFx" aria-hidden="true"></canvas>
        <canvas class="fx draugen-fx" id="draugenFx" aria-hidden="true"></canvas>

        <div class="hud-top">
          <div class="route" id="route" aria-hidden="true"></div>
          <div class="hud-ctrl">
            <div class="speed" id="speedCtl" role="group" aria-label="Fart">
              <button type="button" data-speed="1" class="is-on">1×</button><button type="button" data-speed="2">2×</button><button type="button" data-speed="4">4×</button>
            </div>
            <button type="button" class="hud-btn" id="skipBtn" title="Hopp rett til Bodø" aria-label="Hopp rett til Bodø">⏭</button>
            <button type="button" class="hud-btn" id="soundBtn" title="Lyd av/på" aria-label="Lyd av/på">🔊</button>
            <button type="button" class="hud-btn" id="fsBtn" title="Fullskjerm (F)" aria-label="Fullskjerm">⛶</button>
          </div>
        </div>

        <div class="announce" id="announce" aria-live="polite"></div>
        <div class="evcard-wrap" id="evWrap" aria-live="polite"></div>
        <div class="board" id="board" hidden></div>
        <div class="overlay" id="startOverlay"></div>
        <div class="overlay" id="endOverlay" hidden></div>
      </div>
      <aside class="side" id="side" aria-label="Passasjerer og reiselogg">
        <div class="side-tabs" role="tablist">
          <button type="button" class="is-on" data-side="pax">Om bord <span id="paxCount">0</span></button>
          <button type="button" data-side="log">Reiselogg <span id="logCount">0</span></button>
        </div>
        <div class="side-body">
          <ol class="pax" id="paxList"></ol>
          <ol class="log" id="logList" hidden></ol>
        </div>
      </aside>
    </div>
    <p class="fair-note">Vinnerne trekkes med kryptografisk tilfeldighet idet båten legger fra kai, og låses i skipsloggen med en gang. Resten er ren underholdning.</p>
  </div>
</main>

<footer class="footer" id="footer"></footer>
<script src="js/util.js?v=14" defer></script>
<script src="js/store.js?v=14" defer></script>
<script src="js/events.js?v=14" defer></script>
<script src="js/art.js?v=14" defer></script>
<script src="js/audio.js?v=14" defer></script>
<script src="js/fx.js?v=14" defer></script>
<script src="js/voyage.js?v=14" defer></script>
<script src="js/anims.js?v=14" defer></script>
<script src="js/game.js?v=14" defer></script>
<script src="js/draugen-art.js?v=14" defer></script>
<script src="js/draugen.js?v=14" defer></script>
<script src="js/draugen-anims.js?v=14" defer></script>
<script src="js/keiser-physics.js?v=14" defer></script>
<script src="js/keiser-draw.js?v=14" defer></script>
<script src="js/keiser.js?v=14" defer></script>
<script src="js/lyn.js?v=14" defer></script>
<script src="js/shell.js?v=14" defer></script>
<script src="js/pages/trekning.js?v=14" defer></script>
</body>
</html>
